# ===== Local secrets =====
# Anything you don't want committed (DB_PASSWORD, JWT_SECRET) goes in backend/.env,
# which is gitignored. "optional:" means the app still starts if that file is absent,
# falling back to real environment variables. See .env.example for the template.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ===== Server =====
server.port=5000

# ===== PostgreSQL =====
# Create the database first, e.g.:  createdb libassist   (or via psql: CREATE DATABASE libassist;)
# Credentials come from environment variables so nothing sensitive lives in this committed file.
# Set DB_USERNAME / DB_PASSWORD (and DB_URL if needed) before running - see README for how.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LibAssist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# Override with a JWT_SECRET env var before deploying anywhere real. Must be 32+ chars for HS256.
jwt.secret=${JWT_SECRET:change_this_super_secret_key_before_deploying_min_32_chars}
jwt.expiration-ms=86400000

# ===== CORS =====
# Origin(s) allowed to call this API (React dev server)
app.cors.allowed-origins=http://localhost:3000

# ===== Jackson =====
# Serialize LocalDate/LocalDateTime as ISO-8601 strings instead of number arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Ebooks =====
# Where uploaded book PDFs are stored on disk (gitignored, never served directly by Tomcat).
app.ebook.storage-dir=${EBOOK_STORAGE_DIR:./ebook-files}
app.ebook.max-file-size-mb=50
# Resolution for server-rendered page images; higher is sharper but slower and heavier.
app.ebook.render-dpi=110
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== Subscriptions (INR) =====
app.subscription.monthly-price=99
app.subscription.yearly-price=999
